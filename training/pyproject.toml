[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "weather-diffusion-mobile"
version = "0.1.0"
description = "Conditional DDPM/DDIM teacher to deterministic MobileIE-inspired student for CDD11 restoration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.5,<2.7",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
export = ["onnx>=1.16,<2", "onnxruntime>=1.18,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
weatherdiff = "weatherdiff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weatherdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
